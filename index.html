<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>将棋 感想戦プレイヤー</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#20251f;background:#f5f3ed}*{box-sizing:border-box}body{margin:0}header{padding:18px 16px;background:#23382e;color:white}h1{font-size:20px;margin:0 0 6px}header small{color:#cdd9d1}.wrap{max-width:1050px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(0,550px) minmax(260px,1fr);gap:18px}.panel{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 12px #0000000a}.board{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid #75582f;background:#dcb77a;width:100%;aspect-ratio:1}.sq{border:1px solid #997748;display:flex;align-items:center;justify-content:center;position:relative;font-weight:700;font-size:clamp(14px,4.6vw,30px);cursor:default}.sq.last{background:#f8dd7b}.piece{display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0%,92% 18%,87% 100%,13% 100%,8% 18%);background:#f5dc9f;border:1px solid #6e4e2d;width:83%;height:86%;font-family:serif;line-height:1}.piece.gote{transform:rotate(180deg)}.piece.promoted{color:#b72f2f}.coords{display:flex;justify-content:space-around;font-size:12px;color:#75644b;margin-bottom:4px}.hand{min-height:35px;padding:7px 2px;font-size:14px}.controls{display:flex;gap:7px;margin:12px 0;justify-content:center}.controls button,.jump button{border:1px solid #ccd3c9;background:#f7f9f5;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}.controls button:active,.jump button:active{background:#d5e4d8}input[type=range]{width:100%;accent-color:#315d46}.movehead{font-size:19px;font-weight:750;margin:9px 0}.tag{display:inline-block;border-radius:6px;background:#f5e7bc;padding:4px 8px;font-size:12px;margin:6px 0}.note{line-height:1.75;min-height:100px}.muted{color:#69736b;font-size:13px}.jump{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.jump button{padding:7px 9px;font-size:12px}.moves{max-height:310px;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.moves button{text-align:left;background:#f7f7f4;border:0;border-radius:5px;padding:8px;font-size:13px;cursor:pointer}.moves button.active{background:#d7e9db;font-weight:bold}.inputarea textarea{width:100%;min-height:110px;border:1px solid #ccc;border-radius:8px;padding:8px}.inputarea button{padding:9px 14px;background:#2f5941;color:white;border:0;border-radius:8px}.warning{font-size:12px;color:#7b5831;line-height:1.6}@media(max-width:730px){.wrap{display:block;padding:8px}.panel{margin-bottom:12px;padding:10px}.sq{font-size:clamp(18px,7vw,31px)}.board{max-width:100%}}
.review-top{background:#f0f6ef;border-left:4px solid #386c50;border-radius:8px;padding:10px 12px;margin-bottom:12px}.review-top .note{min-height:0;line-height:1.6}.review-top .warning{margin:7px 0 0}.review-top .movehead{margin:0 0 5px}@media(max-width:730px){.review-top{padding:10px;margin-bottom:9px}}
 .verdict{font-size:15px;font-weight:750;padding:8px 10px;border-radius:8px;margin:5px 0 8px;background:#eef2f7;color:#35465a}.verdict.caution{background:#fff0dd;color:#86501a}.verdict.critical{background:#ffe5e2;color:#a22c22}.verdict.good{background:#e3f3e6;color:#24613b}.review-top .movehead{font-size:23px}.review-top .note{font-size:15px} @media(max-width:730px){.wrap{padding:4px}.panel{padding:7px;border-radius:8px}.hand{min-height:26px;padding:3px 1px;font-size:12px}.coords{margin-bottom:2px}.controls{margin:6px 0}.controls button{padding:9px 13px}.review-top{margin-top:7px;padding:8px}.review-top .movehead{font-size:19px}.review-top .note{font-size:14px;line-height:1.45}.review-top .warning{font-size:11px}.sq{font-size:clamp(17px,6.4vw,29px)}} </style></head><body><div class="wrap"><section class="panel"><div class="hand" id="gotehand"></div><div class="coords">９　　８　　７　　６　　５　　４　　３　　２　　１</div><div class="board" id="board"></div><div class="hand" id="sentehand"></div><input id="slider" type="range" min="0" max="72" value="0"><div class="controls"><button id="first">|◀</button><button id="prev">◀ 前</button><button id="next">次 ▶</button><button id="last">▶|</button></div><div class="review-top"><div class="movehead" id="movehead"></div><div id="verdict" class="verdict">開始局面</div><div id="tag"></div><div id="note" class="note"></div><p class="warning">※「要検討」「危険」等は棋譜からの暫定的な注目度で、AIが算出した悪手・最善手判定ではありません。改善手の確定には将棋エンジン解析が必要です。</p></div><div class="muted">盤面は先手（のほほん）から見た向き。色付きのマスは直前の着手先。</div></section><section class="panel"><h3>注目局面へ移動</h3><p class="muted">各手の評価は暫定的な解説ラベルです。</p><div class="jump" id="jump"></div><h3>指し手一覧</h3><div class="moves" id="movelist"></div></section><section class="panel inputarea" style="grid-column:1/-1"><h3>別のKIF棋譜を読み込む</h3><p class="muted">KIFを貼り付けて「読み込む」を押すと、最終局面に切り替わります。新しい棋譜の自動AI解説は未対応です。</p><textarea id="kif" placeholder="1 ７六歩(77)&#10;2 ３四歩(33) ..."></textarea><p><button id="load">棋譜を読み込む</button> <span id="loadmsg" class="muted"></span></p></section></div><script>
const initial=[{"n": 1, "notation": "７六歩", "origin": [7, 7]}, {"n": 2, "notation": "３四歩", "origin": [3, 3]}, {"n": 3, "notation": "２六歩", "origin": [2, 7]}, {"n": 4, "notation": "８四歩", "origin": [8, 3]}, {"n": 5, "notation": "２五歩", "origin": [2, 6]}, {"n": 6, "notation": "８五歩", "origin": [8, 4]}, {"n": 7, "notation": "７八金", "origin": [6, 9]}, {"n": 8, "notation": "３二金", "origin": [4, 1]}, {"n": 9, "notation": "２四歩", "origin": [2, 5]}, {"n": 10, "notation": "同　歩", "origin": [2, 3]}, {"n": 11, "notation": "同　飛", "origin": [2, 8]}, {"n": 12, "notation": "２三歩打", "origin": null}, {"n": 13, "notation": "２六飛", "origin": [2, 4]}, {"n": 14, "notation": "８八角成", "origin": [2, 2]}, {"n": 15, "notation": "同　銀", "origin": [7, 9]}, {"n": 16, "notation": "２二銀", "origin": [3, 1]}, {"n": 17, "notation": "７七銀", "origin": [8, 8]}, {"n": 18, "notation": "３五角打", "origin": null}, {"n": 19, "notation": "５六飛", "origin": [2, 6]}, {"n": 20, "notation": "５二金", "origin": [6, 1]}, {"n": 21, "notation": "３八銀", "origin": [3, 9]}, {"n": 22, "notation": "３三銀", "origin": [2, 2]}, {"n": 23, "notation": "６八玉", "origin": [5, 9]}, {"n": 24, "notation": "４四銀", "origin": [3, 3]}, {"n": 25, "notation": "２七銀", "origin": [3, 8]}, {"n": 26, "notation": "２四角", "origin": [3, 5]}, {"n": 27, "notation": "２六飛", "origin": [5, 6]}, {"n": 28, "notation": "３三角", "origin": [2, 4]}, {"n": 29, "notation": "３六銀", "origin": [2, 7]}, {"n": 30, "notation": "２四歩", "origin": [2, 3]}, {"n": 31, "notation": "５八金", "origin": [4, 9]}, {"n": 32, "notation": "５四歩", "origin": [5, 3]}, {"n": 33, "notation": "２五歩打", "origin": null}, {"n": 34, "notation": "同　歩", "origin": [2, 4]}, {"n": 35, "notation": "同　銀", "origin": [3, 6]}, {"n": 36, "notation": "３五銀", "origin": [4, 4]}, {"n": 37, "notation": "２八飛", "origin": [2, 6]}, {"n": 38, "notation": "２六歩打", "origin": null}, {"n": 39, "notation": "３六歩", "origin": [3, 7]}, {"n": 40, "notation": "５五角", "origin": [3, 3]}, {"n": 41, "notation": "４六角打", "origin": null}, {"n": 42, "notation": "同　銀", "origin": [3, 5]}, {"n": 43, "notation": "同　歩", "origin": [4, 7]}, {"n": 44, "notation": "同　角", "origin": [5, 5]}, {"n": 45, "notation": "２六飛", "origin": [2, 8]}, {"n": 46, "notation": "１九角成", "origin": [4, 6]}, {"n": 47, "notation": "２四銀", "origin": [2, 5]}, {"n": 48, "notation": "２二歩打", "origin": null}, {"n": 49, "notation": "２三歩打", "origin": null}, {"n": 50, "notation": "４四角打", "origin": null}, {"n": 51, "notation": "２五飛", "origin": [2, 6]}, {"n": 52, "notation": "３三桂", "origin": [2, 1]}, {"n": 53, "notation": "同　銀成", "origin": [2, 4]}, {"n": 54, "notation": "同　金", "origin": [3, 2]}, {"n": 55, "notation": "２二歩成", "origin": [2, 3]}, {"n": 56, "notation": "２四香打", "origin": null}, {"n": 57, "notation": "６五飛", "origin": [2, 5]}, {"n": 58, "notation": "２九馬", "origin": [1, 9]}, {"n": 59, "notation": "７五飛", "origin": [6, 5]}, {"n": 60, "notation": "５三角", "origin": [4, 4]}, {"n": 61, "notation": "４五飛", "origin": [7, 5]}, {"n": 62, "notation": "４四金", "origin": [3, 3]}, {"n": 63, "notation": "４九飛", "origin": [4, 5]}, {"n": 64, "notation": "３八馬", "origin": [2, 9]}, {"n": 65, "notation": "７九飛", "origin": [4, 9]}, {"n": 66, "notation": "４七銀打", "origin": null}, {"n": 67, "notation": "１一と", "origin": [2, 2]}, {"n": 68, "notation": "５八銀成", "origin": [4, 7]}, {"n": 69, "notation": "同　玉", "origin": [6, 8]}, {"n": 70, "notation": "４六桂打", "origin": null}, {"n": 71, "notation": "６八玉", "origin": [5, 8]}, {"n": 72, "notation": "５八金打", "origin": null}];const notes={"9": ["序盤", "飛車先の歩を交換。自然な積極策だが、角交換後の飛車の位置も意識したい。"], "18": ["注意", "△3五角で飛車を狙われる。▲5六飛でかわした後も角の利きを継続確認。"], "33": ["検討", "▲2五歩から銀を前進させる構想。攻めが続くか、相手の△3五銀などを合わせて読む。"], "40": ["重要", "△5五角。実戦の▲4六角から角銀交換となり、後手角が１九に成り込む。交換後の角の進路を確認したい。"], "41": ["検討", "▲4六角は銀に働きかける手。ただし△同銀▲同歩△同角で角の侵入を許す。代案の優劣はエンジン未検証。"], "46": ["重要", "△1九角成で後手に馬ができ香車も失う。先手の２筋攻めとの速度比較が焦点。"], "56": ["重要", "△2四香で飛車を攻撃。ここから飛車の移動が続き、後手の馬が働く。飛車の逃げ先と次の狙いをセットで考えたい。"], "66": ["危険", "△4七銀が５八の金を狙う。▲1一とと進める前に△5八銀成からの寄せを確認したい。"], "67": ["終盤", "▲1一とは香車を取るが、△5八銀成以下で寄せられた。具体的な受けの有無は未検証。"], "72": ["終局", "△5八金で詰み。72手で後手勝ち。"]};const verdicts={9:['攻めの構想','good'],18:['相手の狙いに注意','caution'],33:['攻めの継続を検討','caution'],40:['重要な分岐点（後手の手）','caution'],41:['要検討：角交換後の侵入','caution'],46:['後手の馬が強力','critical'],56:['飛車の逃げ方が課題','caution'],66:['後手の厳しい寄せ','critical'],67:['危険：自玉への攻めを優先確認','critical'],72:['終局・後手勝ち','critical']};let moves=initial.slice(),positions=[],ply=0,activeNotes=notes;
const nums='１２３４５６７８９',kan='一二三四五六七八九',labels={FU:'歩',KY:'香',KE:'桂',GI:'銀',KI:'金',KA:'角',HI:'飛',OU:'玉',TO:'と',NY:'杏',NK:'圭',NG:'全',UM:'馬',RY:'龍'};
const toCode={'歩':'FU','香':'KY','桂':'KE','銀':'GI','金':'KI','角':'KA','飛':'HI','玉':'OU','王':'OU','と':'TO','杏':'NY','圭':'NK','全':'NG','馬':'UM','龍':'RY','竜':'RY'};
const promote={FU:'TO',KY:'NY',KE:'NK',GI:'NG',KA:'UM',HI:'RY'};const demote=Object.fromEntries(Object.entries(promote).map(([a,b])=>[b,a]));
function init(){let b={};function put(side,rank,arr){arr.forEach((t,i)=>{if(t)b[`${9-i},${rank}`]={side,type:t}})}put(1,9,['KY','KE','GI','KI','OU','KI','GI','KE','KY']);put(1,8,[null,'KA',null,null,null,null,null,'HI',null]);put(1,7,Array(9).fill('FU'));put(-1,1,['KY','KE','GI','KI','OU','KI','GI','KE','KY']);put(-1,2,[null,'HI',null,null,null,null,null,'KA',null]);put(-1,3,Array(9).fill('FU'));return {b,h:{1:{},'-1':{}},last:null}}
function clone(s){return JSON.parse(JSON.stringify(s))}function parseMove(line){let m=line.trim().match(/^(\d+)\s+(.+?)(?:\s*\(\s*\d+:\d+.*)?$/);if(!m)return null;let raw=m[2].trim().replace(/\s+$/,'');let o=raw.match(/\((\d)(\d)\)/);return {n:+m[1],notation:raw.replace(/\s*\(\d\d\).*/,''),origin:o?[+o[1],+o[2]]:null}}
function dest(s,prev){let m=s.match(/^([１２３４５６７８９同])([一二三四五六七八九　 ])?/);if(!m)return null;if(m[1]==='同')return prev;return [nums.indexOf(m[1])+1,kan.indexOf(m[2])+1]}
function build(arr){let states=[init()];for(let i=0;i<arr.length;i++){let s=clone(states.at(-1)),m=arr[i],side=i%2===0?1:-1,d=dest(m.notation,s.last);if(!d)throw Error(`${i+1}手目の移動先を読めません`);let key=d.join(','),typeChar=m.notation.replace(/^([１２３４５６７８９同])([一二三四五六七八九　 ])?/,'').replace(/[打成不引寄上直右左行]+/g,'')[0];let type=toCode[typeChar];if(!type)throw Error(`${i+1}手目の駒種を読めません`);let piece;if(m.origin){let from=m.origin.join(',');piece=s.b[from];if(!piece||piece.side!==side)throw Error(`${i+1}手目の移動元が不正です`);delete s.b[from];if(m.notation.includes('成')&&!m.notation.includes('不成'))piece.type=promote[piece.type]||piece.type;}else{piece={side,type};let hand=s.h[side];if((hand[type]||0)<1)throw Error(`${i+1}手目の持ち駒がありません`);hand[type]--;}if(s.b[key]){let captured=demote[s.b[key].type]||s.b[key].type;s.h[side][captured]=(s.h[side][captured]||0)+1;}s.b[key]=piece;s.last=d;states.push(s)}return states}
function render(){let s=positions[ply],board=document.getElementById('board');board.innerHTML='';for(let y=1;y<=9;y++)for(let x=9;x>=1;x--){let el=document.createElement('div');el.className='sq'+(s.last&&s.last[0]===x&&s.last[1]===y?' last':'');let p=s.b[`${x},${y}`];if(p){let q=document.createElement('span');q.className='piece'+(p.side===-1?' gote':'')+(demote[p.type]?' promoted':'');q.textContent=labels[p.type];el.append(q)}board.append(el)}for(let side of [-1,1]){let name=side===1?'sentehand':'gotehand',hand=s.h[side],txt=Object.entries(hand).filter(([k,v])=>v>0).map(([k,v])=>labels[k]+(v>1?'×'+v:'')).join(' ');document.getElementById(name).textContent=(side===1?'▲ 先手 持駒：':'△ 後手 持駒：')+(txt||'なし')}document.getElementById('movehead').textContent=ply===0?'開始局面':`${ply}手目 ${ply%2?'▲':'△'} ${moves[ply-1].notation}`;document.getElementById('slider').value=ply;let v=(activeNotes===notes?verdicts[ply]:null);let ve=document.getElementById('verdict');ve.textContent=ply===0?'開始局面':v?v[0]:'判定なし（AI解析未実施）';ve.className='verdict '+(v?v[1]:'');let n=activeNotes[ply];document.getElementById('tag').innerHTML=n?`<span class="tag">${n[0]}</span>`:'';document.getElementById('note').textContent=n?n[1]:'この手に個別の解説はありません。前後の指し手と盤面を見比べてみよう。';document.querySelectorAll('.moves button').forEach((b,i)=>b.classList.toggle('active',i===ply-1));}
function go(n){ply=Math.max(0,Math.min(moves.length,n));render()};function setup(){positions=build(moves);document.getElementById('slider').max=moves.length;document.getElementById('movelist').innerHTML='';moves.forEach((m,i)=>{let b=document.createElement('button');b.textContent=`${m.n} ${i%2?'△':'▲'} ${m.notation}`;b.onclick=()=>go(i+1);document.getElementById('movelist').append(b)});document.getElementById('jump').innerHTML='';Object.keys(activeNotes).forEach(k=>{if(+k>moves.length)return;let b=document.createElement('button');b.textContent=k+'手目';b.onclick=()=>go(+k);document.getElementById('jump').append(b)});go(0)}
document.getElementById('first').onclick=()=>go(0);document.getElementById('prev').onclick=()=>go(ply-1);document.getElementById('next').onclick=()=>go(ply+1);document.getElementById('last').onclick=()=>go(moves.length);document.getElementById('slider').oninput=e=>go(+e.target.value);document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')go(ply+1);if(e.key==='ArrowLeft')go(ply-1)});document.getElementById('load').onclick=()=>{try{let arr=document.getElementById('kif').value.split(/\r?\n/).map(parseMove).filter(m=>m && !/^(詰み|投了|中断|千日手|持将棋|切れ負け|反則)/.test(m.notation));if(!arr.length)throw Error('棋譜の指し手が見つかりません');let pos=build(arr);moves=arr;activeNotes={};positions=pos;document.getElementById('slider').max=arr.length;document.getElementById('movelist').innerHTML='';arr.forEach((m,i)=>{let b=document.createElement('button');b.textContent=`${m.n} ${i%2?'△':'▲'} ${m.notation}`;b.onclick=()=>go(i+1);document.getElementById('movelist').append(b)});document.getElementById('jump').innerHTML='';Object.keys(activeNotes).forEach(k=>{if(+k>arr.length)return;let b=document.createElement('button');b.textContent=k+'手目';b.onclick=()=>go(+k);document.getElementById('jump').append(b)});go(arr.length);document.getElementById('board').scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('loadmsg').textContent=`${arr.length}手を読み込みました（解説は今回の対局専用です）`;}catch(e){document.getElementById('loadmsg').textContent='読み込みエラー：'+e.message}};setup();
</script></body></html>
